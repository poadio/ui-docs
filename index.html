<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poad UI</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1b1f24; --muted: #5b6470; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111418; --fg: #e8ebef; --muted: #9aa4b0; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 36rem; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 1.75rem; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>poad UI</h1>
  <p>Une bibliothèque de composants, chaque framework : Angular, Next.js, React, Vue et composants web. La documentation arrive bientôt.</p>
</main>
</body>
</html>
